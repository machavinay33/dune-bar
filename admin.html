<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard | Dune Bar & Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .full-width { grid-column: span 2; }
        #eventsTab, #bookingsTab { margin-top: 20px; }

        /* Image Upload Styles */
        .upload-area {
            border: 2px dashed var(--color-border-light);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            background: var(--color-bg);
            position: relative;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--color-accent);
            background: rgba(209, 169, 69, 0.05);
        }
        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .upload-area .upload-icon {
            font-size: 2rem;
            color: var(--color-text-dim);
            margin-bottom: 8px;
        }
        .upload-area .upload-text {
            color: var(--color-text-muted);
            font-size: 0.85rem;
        }
        .upload-area .upload-text strong {
            color: var(--color-accent);
        }
        .upload-area .upload-hint {
            color: var(--color-text-dim);
            font-size: 0.75rem;
            margin-top: 6px;
        }
        .image-preview-container {
            margin-top: 12px;
            display: none;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--color-border);
        }
        .image-preview-container img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
        }
        .image-preview-container .remove-image {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-progress {
            margin-top: 10px;
            height: 4px;
            background: var(--color-border);
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .upload-progress .progress-bar {
            height: 100%;
            background: var(--color-accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        .upload-status {
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--color-text-muted);
            display: none;
        }
        .upload-status.success { color: #4ade80; }
        .upload-status.error { color: #f87171; }
        .upload-status.uploading { color: var(--color-accent); }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Login Section -->
        <div id="loginSection" class="login-box">
            <h2 class="section-title text-center" style="font-size: 1.8rem; margin-bottom: 30px;">Admin <span class="accent">Login</span></h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" value="Dune@admin.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="dashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 12px;">
                <h1 class="section-title" style="margin: 0;">Admin <span class="accent">Dashboard</span></h1>
                <button onclick="handleLogout()" class="btn btn-outline btn-small">Logout</button>
            </div>

            <div class="admin-nav">
                <div class="admin-nav-item active" onclick="switchTab('events')">Manage Events</div>
                <div class="admin-nav-item" onclick="switchTab('bookings')">View Bookings</div>
            </div>

            <!-- Events Tab -->
            <div id="eventsTab">
                <div class="form-card">
                    <h3 id="formTitle">Add New Event</h3>
                    <form id="eventForm" class="event-form-grid">
                        <input type="hidden" id="eventId">
                        <div class="form-group full-width">
                            <label>Event Title</label>
                            <input type="text" id="title" required>
                        </div>
                        <div class="form-group full-width">
                            <label>Cover Photo</label>
                            <div class="upload-area" id="uploadArea">
                                <div class="upload-icon">&#128247;</div>
                                <p class="upload-text">Tap to select photo or <strong>drop image here</strong></p>
                                <p class="upload-hint">JPG, PNG, WebP &mdash; Max 5MB</p>
                                <input type="file" id="imageFile" accept="image/*" capture="environment">
                            </div>
                            <div class="upload-progress" id="uploadProgress">
                                <div class="progress-bar" id="progressBar"></div>
                            </div>
                            <div class="upload-status" id="uploadStatus"></div>
                            <div class="image-preview-container" id="imagePreview">
                                <img id="previewImg" src="" alt="Preview">
                                <button type="button" class="remove-image" onclick="removeImage()" title="Remove image">&times;</button>
                            </div>
                            <!-- Hidden field to store the URL after upload -->
                            <input type="hidden" id="image_url" value="">
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label>Time</label>
                            <input type="time" id="time" required>
                        </div>
                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" id="location" value="Dune Bar & Kitchen" required>
                        </div>
                        <div class="form-group">
                            <label>Existing Image URL (optional, edit only)</label>
                            <input type="url" id="existing_image_url" placeholder="Auto-filled when editing existing event">
                        </div>
                        <div class="full-width" style="display: flex; gap: 12px; flex-wrap: wrap;">
                            <button type="submit" class="btn btn-primary" id="submitBtn">Save Event</button>
                            <button type="button" onclick="resetForm()" class="btn btn-outline">Cancel</button>
                        </div>
                    </form>
                </div>

                <div class="admin-table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Date/Time</th>
                                <th>Location</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="eventsTableBody">
                            <!-- Events loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Bookings Tab -->
            <div id="bookingsTab" style="display: none;">
                <div class="admin-table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Event</th>
                                <th>Guest Name</th>
                                <th>Contact</th>
                                <th>Guests</th>
                                <th>Booked At</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTableBody">
                            <!-- Bookings loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
