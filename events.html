<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Events | Dune Bar & Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Modal styles */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .modal-content { background: var(--color-bg-elevated); margin: 10% auto; padding: 30px; border: 1px solid var(--color-accent); width: 90%; max-width: 500px; border-radius: 8px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #c4a052; }
    </style>
</head>
<body class="bg-dark">
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="images/logo_clean.png" alt="Dune Logo" class="logo-img">
            </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="events.html" class="nav-link active">Upcoming Events</a></li>
            </ul>
        </div>
    </nav>

    <section class="events-container container">
        <div class="section-header text-center">
            <span class="section-label">Join Us</span>
            <h2 class="section-title">Upcoming <span class="accent">Events</span></h2>
        </div>
        
        <div id="eventsList" class="events-grid">
            <!-- Events will be loaded here -->
            <div class="text-center w-100" id="loading">Loading events...</div>
        </div>
    </section>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 class="section-title" style="font-size: 1.5rem;">Book for <span id="modalEventTitle" class="accent"></span></h3>
            <form id="eventBookingForm" class="reservation-form" style="padding: 0; background: none; border: none;">
                <input type="hidden" id="bookingEventId">
                <div class="form-group">
                    <label for="b_name">Name</label>
                    <input type="text" id="b_name" required>
                </div>
                <div class="form-group">
                    <label for="b_email">Email</label>
                    <input type="email" id="b_email" required>
                </div>
                <div class="form-group">
                    <label for="b_phone">Phone</label>
                    <input type="tel" id="b_phone" required>
                </div>
                <div class="form-group">
                    <label for="b_guests">Number of Guests</label>
                    <input type="number" id="b_guests" min="1" value="2" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Confirm Booking</button>
            </form>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
